<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#cfb468" />
    <title>Do Not Tamper — Sticker Customizer</title>
    <script type="module" crossorigin src="./assets/index-BBI6ZVx-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-_j2vYnxe.css">
  </head>
  <body>
    <main class="app">
      <section class="preview">
        <div class="preview-stage">
          <div id="sticker-mount" class="sticker-mount"></div>
        </div>
      </section>

      <aside class="controls">
        <h1 class="controls-title">Customize Sticker</h1>

        <section class="control-group">
          <h2>Gradient theme</h2>
          <div class="field">
            <div id="input-gradient" class="swatch-list" role="radiogroup" aria-label="Gradient theme"></div>
            <span class="field-hint">Controls the animated holo stripe</span>
          </div>
        </section>

        <section class="control-group">
          <h2>Text</h2>
          <label class="field">
            <span class="field-label">Title</span>
            <input id="input-title" type="text" maxlength="24" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Serial number</span>
            <input id="input-serial" type="text" maxlength="24" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Tracking line 1</span>
            <input id="input-track1" type="text" maxlength="28" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Tracking line 2</span>
            <input id="input-track2" type="text" maxlength="28" autocomplete="off" />
          </label>
          <button id="btn-randomize" class="btn btn-ghost btn-block" type="button">
            Randomize codes
          </button>
        </section>

        <section class="control-group">
          <h2>Export Tape</h2>
          <div class="export-row">
            <button id="btn-download-png" class="btn btn-highlight" type="button">Save PNG</button>
            <button id="btn-download-svg" class="btn btn-ghost" type="button">Save SVG</button>
            <button id="btn-download-pdf" class="btn btn-ghost" type="button">Save PDF</button>
          </div>
          <button id="btn-reset" class="btn btn-ghost btn-block" type="button">Reset</button>
        </section>

        <footer class="controls-footer">
          <p>Template based on the original "Do Not Tamper" pen by Richard Rose (MIT).</p>
        </footer>
      </aside>
    </main>

  </body>
</html>
